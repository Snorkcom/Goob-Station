- type: entity
  parent: PinpointerSyndicateNuclear
  id: PinpointerSyndicateHighRisk
  name: high-risk pinpointer
  description: A Syndicate pinpointer configured to find the station's most valuable targets or an exact DNA sequence.
  components:
  # The custom interface supplies explicit targets instead of using the standard automatic target search.
  - type: Pinpointer
    whitelist: null
    targetName: null
    canToggle: false
    canEmag: false
  - type: HighRiskPinpointer
  - type: ActivatableUI
    inHandsOnly: true
    singleUser: true
    requireActiveHand: false
    key: enum.HighRiskPinpointerUiKey.Key
  - type: UserInterface
    interfaces:
      enum.HighRiskPinpointerUiKey.Key:
        type: HighRiskPinpointerUserInterface
